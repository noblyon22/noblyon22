
name: Update GitHub Contribution Calendar

on:
  schedule:
    - cron: "17 0 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: contribution-calendar
  cancel-in-progress: true

jobs:
  generate:
    runs-on: ubuntu-latest

    steps:
      - name: Generate contribution calendar
        uses: pipipi-dev/gcchart@v1
        with:
          outputs: |
            contributions.svg
